<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF 오버레이 하니스 — 좌표동기 + 포커스-스왑</title>
<style>
  :root { --chrome: #2a2d40; --bar: #3a3d55; --edge: #4a4d66; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  /* 데스크톱 = Unity 캔버스가 그려질 영역을 흉내낸다. position:fixed 오버레이는
     이 요소의 overflow로 잘리지 않으므로, 클리핑은 JS가 교집합으로 직접 처리한다. */
  #desktop {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(circle at 30% 20%, #2b2f4a, #171826);
  }
  /* 상단 바 = "다른 창이 위를 덮는" 상황을 만들기 위한 장애물(클리핑 검증용). */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 50;
    background: #11121c; color: #cdd; display: flex; align-items: center;
    padding: 0 14px; font-size: 13px; gap: 16px; border-bottom: 1px solid #333;
  }
  #topbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  /* 창 = Unity가 그리는 창 크롬(타이틀바/테두리/리사이즈). PDF 콘텐츠는 여기 안 그림. */
  .window {
    position: absolute; display: flex; flex-direction: column;
    background: var(--chrome); border: 1px solid var(--edge); border-radius: 8px;
    box-shadow: 0 12px 40px #0009; min-width: 260px; min-height: 200px;
  }
  .window.dragging, .window.resizing { user-select: none; }
  .titlebar {
    height: 34px; background: var(--bar); color: #eef; cursor: move;
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    border-radius: 8px 8px 0 0; font-size: 13px; user-select: none;
  }
  .titlebar .hint { margin-left: auto; font-size: 11px; opacity: .55; }
  .content { flex: 1; position: relative; overflow: hidden; background: #fff; border-radius: 0 0 8px 8px; }
  .content .snapshot { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .content .placeholder { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #888; font-size: 13px; text-align: center; padding: 20px; }
  .resize-handle {
    position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
    cursor: nwse-resize; z-index: 2;
    background: linear-gradient(135deg, transparent 50%, #888 50%, #888 60%, transparent 60%, transparent 75%, #888 75%, #888 85%, transparent 85%);
  }

  /* PDF 오버레이 = Unity 캔버스 "위"에 뜨는 실제 DOM. 창 콘텐츠 영역에 좌표동기된다.
     position:fixed 라 데스크톱 클리핑을 안 받음 → JS가 교집합으로 박스를 잘라주고
     iframe을 음수 마진으로 밀어 콘텐츠 정렬을 유지한다. */
  #pdf-overlay { position: fixed; overflow: hidden; z-index: 40; background: #fff; }
  #pdf-overlay iframe { border: 0; display: block; }
  #pdf-overlay.hidden { display: none; }

  #log { position: fixed; right: 8px; bottom: 8px; z-index: 60; font: 11px monospace;
    color: #9fb; background: #000a; padding: 6px 8px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<div id="topbar">
  <strong>PDF 오버레이 하니스</strong>
  <label><input type="checkbox" id="liveToggle" checked /> 라이브(포커스)</label>
  <label><input type="checkbox" id="clipTopbar" checked /> 상단바에 클리핑(창을 위로 끌어보기)</label>
  <span style="opacity:.5">창을 드래그/리사이즈하며 오버레이 정합·클리핑·스왑을 확인</span>
</div>

<div id="desktop">
  <div class="window" id="pdfwin" style="left:120px; top:80px; width:540px; height:700px;">
    <div class="titlebar" data-drag>
      📄 Resume.pdf <span class="hint">타이틀바 드래그 · 우하단 리사이즈</span>
    </div>
    <div class="content" id="pdfcontent">
      <img class="snapshot" id="snapshot" style="display:none" alt="snapshot" />
      <div class="placeholder" id="placeholder" style="display:none">백그라운드(스냅샷) 상태</div>
    </div>
    <div class="resize-handle" data-resize></div>
  </div>
</div>

<!-- 실제 브라우저 DOM 오버레이: pdf.js 정식 viewer(선택·검색·폼·링크 native) -->
<div id="pdf-overlay">
  <iframe id="pdfFrame" src="pdfjs/web/viewer.html?file=/docs/resume.pdf#zoom=page-fit"></iframe>
</div>

<div id="log">init…</div>

<script>
const win = document.getElementById('pdfwin');
const content = document.getElementById('pdfcontent');
const overlay = document.getElementById('pdf-overlay');
const iframe = document.getElementById('pdfFrame');
const snapshot = document.getElementById('snapshot');
const placeholder = document.getElementById('placeholder');
const topbar = document.getElementById('topbar');
const liveToggle = document.getElementById('liveToggle');
const clipTopbar = document.getElementById('clipTopbar');
const logEl = document.getElementById('log');

// ── 좌표 동기 ─────────────────────────────────────────────
// 창 콘텐츠 영역의 뷰포트 사각형을 계산 → 오버레이 박스를 교집합으로 클리핑 →
// iframe을 음수 마진으로 밀어 PDF 콘텐츠 정렬 유지. (Unity에선 창 스크린 rect가 입력)
function syncOverlay() {
  if (overlay.classList.contains('hidden')) { requestAnimationFrame(syncOverlay); return; }
  const c = content.getBoundingClientRect();
  const topLimit = clipTopbar.checked ? topbar.getBoundingClientRect().bottom : 0;

  // 클리핑 경계(교집합): 데스크톱(뷰포트) + 상단바
  const clip = {
    left: Math.max(c.left, 0),
    top: Math.max(c.top, topLimit),
    right: Math.min(c.right, window.innerWidth),
    bottom: Math.min(c.bottom, window.innerHeight),
  };
  const w = Math.max(0, clip.right - clip.left);
  const h = Math.max(0, clip.bottom - clip.top);

  overlay.style.left = clip.left + 'px';
  overlay.style.top = clip.top + 'px';
  overlay.style.width = w + 'px';
  overlay.style.height = h + 'px';

  // iframe은 원래 콘텐츠 크기를 유지하고, 잘린 만큼 음수로 밀어 정렬
  iframe.style.width = c.width + 'px';
  iframe.style.height = c.height + 'px';
  iframe.style.marginLeft = (c.left - clip.left) + 'px';
  iframe.style.marginTop = (c.top - clip.top) + 'px';

  logEl.textContent =
    `content ${c.width|0}×${c.height|0} @(${c.left|0},${c.top|0})\n` +
    `overlay ${w|0}×${h|0} @(${clip.left|0},${clip.top|0})\n` +
    `live=${liveToggle.checked}`;
  requestAnimationFrame(syncOverlay);
}
requestAnimationFrame(syncOverlay);

// ── 포커스-스왑 ───────────────────────────────────────────
// 라이브 OFF: iframe 뷰어의 실제 page canvas를 읽어 스냅샷으로 굳히고 오버레이 숨김.
//            (Unity에선 이 스냅샷이 텍스처가 되어 다른 창에 정상적으로 가려짐)
// 라이브 ON : 오버레이 복귀 → 선택/검색/폼/링크 native 동작.
// 뷰어의 현재 보이는 영역을 "실제 페이지 캔버스들"에서 직접 합성한다.
// pdf.js가 각 페이지를 <canvas>로 렌더하므로, 현재 스크롤에서 보이는 부분을
// drawImage로 잘라 붙이면 픽셀 퍼펙트 스냅샷이 된다(무의존, 현재 페이지/스크롤 반영).
function compositeVisible(idoc) {
  const vc = idoc.querySelector('#viewerContainer');
  if (!vc) return null;
  const vcRect = vc.getBoundingClientRect();
  const canvases = idoc.querySelectorAll('#viewer .canvasWrapper canvas, #viewer .page canvas');
  if (!canvases.length) return null;

  // 페이지 캔버스의 디바이스/CSS 배율(선명도 유지용)
  let ratio = window.devicePixelRatio || 1;
  for (const cv of canvases) {
    const r = cv.getBoundingClientRect();
    if (r.width > 0) { ratio = cv.width / r.width; break; }
  }

  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(vcRect.width * ratio));
  out.height = Math.max(1, Math.round(vcRect.height * ratio));
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#2a2d40';
  ctx.fillRect(0, 0, out.width, out.height);

  for (const cv of canvases) {
    const r = cv.getBoundingClientRect();
    // 뷰포트와의 교집합(보이는 부분만)
    const ix1 = Math.max(vcRect.left, r.left), iy1 = Math.max(vcRect.top, r.top);
    const ix2 = Math.min(vcRect.right, r.right), iy2 = Math.min(vcRect.bottom, r.bottom);
    if (ix2 <= ix1 || iy2 <= iy1 || r.width === 0 || r.height === 0) continue;

    const sx = cv.width / r.width, sy = cv.height / r.height;
    const srcX = (ix1 - r.left) * sx, srcY = (iy1 - r.top) * sy;
    const srcW = (ix2 - ix1) * sx, srcH = (iy2 - iy1) * sy;
    const dstX = (ix1 - vcRect.left) * ratio, dstY = (iy1 - vcRect.top) * ratio;
    const dstW = (ix2 - ix1) * ratio, dstH = (iy2 - iy1) * ratio;
    try { ctx.drawImage(cv, srcX, srcY, srcW, srcH, dstX, dstY, dstW, dstH); } catch (e) {}
  }
  return out.toDataURL('image/png');
}

function grabSnapshot() {
  try {
    const dataUrl = compositeVisible(iframe.contentDocument);
    if (!dataUrl) return false;
    snapshot.src = dataUrl;
    return true;
  } catch (e) { console.warn('스냅샷 합성 실패', e); return false; }
}

function setLive(live) {
  if (live) {
    overlay.classList.remove('hidden');
    snapshot.style.display = 'none';
    placeholder.style.display = 'none';
  } else {
    const ok = grabSnapshot();
    snapshot.style.display = ok ? 'block' : 'none';
    placeholder.style.display = ok ? 'none' : 'flex';
    overlay.classList.add('hidden');
  }
}
liveToggle.addEventListener('change', () => setLive(liveToggle.checked));

// ── 드래그 / 리사이즈 (Unity 창 조작 시뮬레이션) ──────────
let drag = null;
win.addEventListener('mousedown', (e) => {
  const t = e.target;
  const r = win.getBoundingClientRect();
  if (t.hasAttribute('data-drag')) {
    drag = { mode: 'move', dx: e.clientX - r.left, dy: e.clientY - r.top };
    win.classList.add('dragging');
  } else if (t.hasAttribute('data-resize')) {
    drag = { mode: 'resize', ox: e.clientX, oy: e.clientY, w: r.width, h: r.height };
    win.classList.add('resizing');
  } else { return; }
  // 드래그 중 iframe이 마우스 이벤트를 삼키지 않도록
  overlay.style.pointerEvents = 'none';
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  if (drag.mode === 'move') {
    win.style.left = (e.clientX - drag.dx) + 'px';
    win.style.top = (e.clientY - drag.dy) + 'px';
  } else {
    win.style.width = Math.max(260, drag.w + (e.clientX - drag.ox)) + 'px';
    win.style.height = Math.max(200, drag.h + (e.clientY - drag.oy)) + 'px';
  }
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  drag = null;
  win.classList.remove('dragging', 'resizing');
  overlay.style.pointerEvents = '';
});
</script>
</body>
</html>
